name: Build Desktop App

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            # AppImage tooling for arm64 cannot execute on the x86_64
            # runner; ship deb and rpm for Linux ARM
            args: --target aarch64-unknown-linux-gnu --bundles deb,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Linux dependencies
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

    - name: Install cross-compilation tools (aarch64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo dpkg --add-architecture arm64
        sudo sed -i -E '/^(deb(-src)? )\[/! s|^(deb(-src)?) |\1 [arch=amd64] |' /etc/apt/sources.list /etc/apt/sources.list.d/*.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main universe multiverse restricted" | sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/arm64.list > /dev/null
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/arm64.list > /dev/null
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libwebkit2gtk-4.1-dev:arm64 libglib2.0-dev:arm64 libgtk-3-dev:arm64 \
          librsvg2-dev:arm64 libayatana-appindicator3-dev:arm64 libssl-dev:arm64
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: gui
      run: npm ci

    - name: Build frontend
      working-directory: gui
      run: npm run build

    - name: Setup Python (host toolchain)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # setup-python writes its own PKG_CONFIG_PATH into GITHUB_ENV, clobbering
    # the cross-compilation path set above; restore it so cross builds of the
    # GTK stack (soup3-sys etc.) still resolve aarch64 libraries.
    - name: Restore cross pkg-config path
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

    - name: Build abirqu wheel
      run: |
        python -m pip install --quiet build
        python -m build --wheel

    # Embed a self-contained Python runtime (CPython from
    # python-build-standalone + numpy/scipy/cryptography + the abirqu wheel)
    # as a Tauri resource so the desktop installers need no system Python.
    - name: Install bundled Python runtime
      shell: bash
      env:
        PBS_TAG: '20261026'
        PBS_VERSION: '3.12.16'
      run: |
        set -e
        case "${{ matrix.target }}" in
          x86_64-unknown-linux-gnu)  PLAT=manylinux2014_x86_64 ;;
          aarch64-unknown-linux-gnu) PLAT=manylinux2014_aarch64 ;;
          aarch64-apple-darwin)      PLAT=macosx_12_0_arm64 ;;
          x86_64-apple-darwin)       PLAT=macosx_10_9_x86_64 ;;
          x86_64-pc-windows-msvc)    PLAT=win_amd64 ;;
        esac
        curl -sL -o /tmp/python.tar.gz \
          "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_VERSION}+${PBS_TAG}-${{ matrix.target }}-install_only_stripped.tar.gz"
        mkdir -p gui/src-tauri/resources
        tar -xzf /tmp/python.tar.gz -C gui/src-tauri/resources
        # Trim interpreter payload the app never loads
        PYSP=gui/src-tauri/resources/python/lib/python3.12
        WINSP=gui/src-tauri/resources/python/Lib
        rm -rf "$PYSP/test" "$PYSP/idlelib" "$PYSP/tkinter" "$PYSP/turtledemo" \
               "$WINSP/test" "$WINSP/idlelib" "$WINSP/tkinter" "$WINSP/turtledemo" 2>/dev/null || true
        SP="$PYSP/site-packages"; [ -d "$SP" ] || SP="$WINSP/site-packages"
        python -m pip install --quiet --no-cache-dir --target "$SP" \
          --platform "$PLAT" --python-version 312 --implementation cp \
          --only-binary=:all: \
          "numpy>=1.22" "scipy>=1.7.0" "cryptography>=3.4" dist/*.whl
        echo "bundled runtime site-packages: $SP"
        du -sh gui/src-tauri/resources/python || true

    - name: Build Tauri app
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # linuxdeploy's bundled strip breaks on modern ELF sections
        NO_STRIP: 'true'
        # numpy/scipy wheels ship hashed shared libs (numpy.libs/, scipy.libs/)
        # whose DT_NEEDED SONAMEs have no file on the system; point linuxdeploy
        # at the wheel copies so AppImage dependency deployment can resolve them
        LD_LIBRARY_PATH: ${{ github.workspace }}/gui/src-tauri/resources/python/lib/python3.12/site-packages/numpy.libs:${{ github.workspace }}/gui/src-tauri/resources/python/lib/python3.12/site-packages/scipy.libs
      with:
        projectPath: gui
        tauriScript: npx tauri
        args: ${{ matrix.args }}

    - name: Upload Linux artifacts
      if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'x86_64-unknown-linux-gnu'
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64
        path: |
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

    - name: Upload Linux ARM artifacts
      if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'aarch64-unknown-linux-gnu'
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64
        path: |
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

    - name: Upload Windows artifacts
      if: matrix.platform == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64
        path: |
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

    - name: Upload macOS ARM artifacts
      if: matrix.platform == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: |
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

    - name: Upload macOS Intel artifacts
      if: matrix.platform == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
      uses: actions/upload-artifact@v4
      with:
        name: macos-x64
        path: |
          gui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # softprops/action-gh-release needs write access to publish the release
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          linux-x64/**
          linux-arm64/**
          windows-x64/**
          macos-arm64/**
          macos-x64/**
